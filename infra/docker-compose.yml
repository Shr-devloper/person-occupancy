services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartseat
      POSTGRES_USER: smartseat
      POSTGRES_PASSWORD: smartseat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartseat -d smartseat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ../web_dashboard
    depends_on:
      - backend
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - web
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres-data:
